/* ---------- Google Drive helpers ---------- */
async function driveFindFile(token) {
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error("No se pudo buscar el archivo en Drive.");
  const data = await res.json();
  return data.files && data.files.length ? data.files[0].id : null;
}

async function driveCreateFile(token, initialContent) {
  const metadata = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
  const boundary = "-------314159265358979323846";
  const delimiter = `\r\n--${boundary}\r\n`;
  const closeDelim = `\r\n--${boundary}--`;
  const body =
    delimiter + "Content-Type: application/json\r\n\r\n" + JSON.stringify(metadata) +
    delimiter + "Content-Type: application/json\r\n\r\n" + initialContent +
    closeDelim;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!res.ok) throw new Error("No se pudo crear el archivo en Drive.");
  const data = await res.json();
  return data.id;
}

async function driveReadFile(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) return [];
  const text = await res.text();
  try { const parsed = JSON.parse(text); return Array.isArray(parsed) ? parsed : []; } catch (e) { return []; }
}

async function driveWriteFile(token, fileId, contentString) {
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: contentString,
  });
}

function TrendLineChart({ labels, series }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: {
        labels: labels,
        datasets: series.map((s) => ({
          label: s.label, data: s.data, borderColor: s.color, backgroundColor: s.color + "22",
          tension: 0.3, fill: false, pointRadius: 3, pointBackgroundColor: s.color, borderWidth: 2,
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${clp(ctx.raw)}` } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#8891B5", font: { size: 11, family: "Poppins" }, maxRotation: 0, autoSkip: true } },
          y: { grid: { color: "#F1F2FA" }, ticks: { color: "#8891B5", font: { size: 11, family: "Poppins" }, callback: (v) => clp(v) } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [labels, series]);
  return <div style={{ position: "relative", width: "100%", height: 280 }}><canvas ref={canvasRef} role="img" aria-label="Evolución"></canvas></div>;
}

/* ---------- Section (Gastos / Inversiones / Ingresos) ---------- */
function SectionView({ type, movements, setMovements, persist }) {
  const meta = SECTION_META[type];
  const catById = Object.fromEntries(meta.categories.map((c) => [c.id, c]));
  const [modalOpen, setModalOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [filters, setFilters] = useState({ category: "todas", month: "todos" });
  const emptyForm = { date: todayISO(), category: meta.categories[0].id, amount: "", description: "" };
  const [form, setForm] = useState(emptyForm);
  const [formError, setFormError] = useState("");

  const sectionMovements = movements.filter((m) => m.type === type);

  const availableMonths = useMemo(() => {
    const keys = new Set(sectionMovements.map((m) => monthKey(m.date)));
    return Array.from(keys).sort().reverse();
  }, [sectionMovements]);

  const filtered = useMemo(() => {
    return sectionMovements.filter((e) => {
      if (filters.category !== "todas" && e.category !== filters.category) return false;
      if (filters.month !== "todos" && monthKey(e.date) !== filters.month) return false;
      return true;
    }).sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [sectionMovements, filters]);

  const total = useMemo(() => filtered.reduce((s, e) => s + e.amount, 0), [filtered]);
  const avg = filtered.length ? total / filtered.length : 0;
  const byCategory = useMemo(() => {
    const map = {};
    filtered.forEach((e) => { map[e.category] = (map[e.category] || 0) + e.amount; });
    return meta.categories.map((c) => ({ ...c, total: map[c.id] || 0 })).filter((c) => c.total > 0).sort((a, b) => b.total - a.total);
  }, [filtered]);
  const topCategory = byCategory[0];

  const openAddModal = () => { setEditingId(null); setForm(emptyForm); setFormError(""); setModalOpen(true); };
  const openEditModal = (entry) => {
    setEditingId(entry.id);
    setForm({ date: entry.date, category: entry.category, amount: String(entry.amount), description: entry.description || "" });
    setFormError("");
    setModalOpen(true);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    const amountNum = Number(form.amount);
    if (!amountNum || amountNum <= 0) { setFormError("Ingresa un monto válido."); return; }
    setFormError("");
    if (editingId) {
      const next = movements.map((m) => m.id === editingId
        ? { ...m, date: form.date, category: form.category, amount: Math.round(amountNum), description: form.description.trim() }
        : m);
      setMovements(next); persist(next);
    } else {
      const entry = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, type, date: form.date, category: form.category, amount: Math.round(amountNum), description: form.description.trim() };
      const next = [...movements, entry];
      setMovements(next); persist(next);
    }
    setForm(emptyForm);
    setEditingId(null);
    setModalOpen(false);
  };

  const handleDelete = (id) => { const next = movements.filter((e) => e.id !== id); setMovements(next); persist(next); };

  const exportCSV = () => {
    const header = "Fecha,Categoria,Monto,Descripcion\n";
    const rows = filtered.map((e) => `${e.date},${catById[e.category]?.label || ""},${e.amount},"${(e.description || "").replace(/"/g, '""')}"`).join("\n");
    const blob = new Blob(["\uFEFF" + header + rows], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${type}.csv`; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", flexWrap: "wrap", gap: 16, marginBottom: 20 }}>
        <div>
          <h1 style={{ margin: 0, fontSize: 26, fontWeight: 800, color: meta.accent }}>Registro de {meta.label}</h1>
          <p style={{ margin: "4px 0 0", fontSize: 13.5, color: "#8891B5" }}>Seguimiento y control de tus {meta.label.toLowerCase()}.</p>
        </div>
        <button onClick={openAddModal} style={{ display: "flex", alignItems: "center", gap: 8, background: meta.accent, color: "#fff", border: "none", borderRadius: 10, padding: "11px 18px", fontSize: 13.5, fontWeight: 600 }}>
          <Icon name="plus" size={16} color="#fff" /> Nuevo {meta.singular}
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", gap: 14, marginBottom: 22 }}>
        <KpiCard icon="wallet" iconBg={meta.accentLight} iconColor={meta.accent} label="Total" value={clp(total)} />
        <KpiCard icon="list" iconBg="#FEF3E2" iconColor="#F59E0B" label="Movimientos" value={filtered.length} />
        <KpiCard icon="trend" iconBg="#E6F7F0" iconColor="#10B981" label={`Promedio por ${meta.singular.toLowerCase()}`} value={clp(avg)} />
        <KpiCard icon="alert" iconBg="#FDECEC" iconColor="#EF4444" label="Mayor categoría" value={topCategory ? topCategory.label : "—"} />
      </div>

      <div style={{ background: "#fff", border: "1px solid #ECEEF8", borderRadius: 14, padding: 18, marginBottom: 20 }}>
        <p style={{ display: "flex", alignItems: "center", gap: 6, margin: "0 0 12px", fontSize: 13, fontWeight: 600, color: meta.accent }}>
          <Icon name="search" size={15} color={meta.accent} /> Filtros
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1.4fr auto", gap: 12, alignItems: "end" }}>
          <div>
            <label style={{ display: "block", fontSize: 11, color: "#8891B5", marginBottom: 5 }}>Categoría</label>
            <select value={filters.category} onChange={(e) => setFilters({ ...filters, category: e.target.value })}>
              <option value="todas">Todas las categorías</option>
              {meta.categories.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </div>
          <div>
            <label style={{ display: "block", fontSize: 11, color: "#8891B5", marginBottom: 5 }}>Mes</label>
            <select value={filters.month} onChange={(e) => setFilters({ ...filters, month: e.target.value })}>
              <option value="todos">Todos los meses</option>
              {availableMonths.map((m) => <option key={m} value={m}>{monthLabelFull(m)}</option>)}
            </select>
          </div>
          <button onClick={exportCSV} style={{ background: meta.accent, color: "#fff", border: "none", borderRadius: 10, padding: "9px 16px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap" }}>Excel</button>
        </div>
      </div>

      <div style={{ background: "#fff", border: "1px solid #ECEEF8", borderRadius: 14, overflow: "hidden" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: meta.accentLight }}>
              {["Fecha", "Categoría", "Monto", "Descripción", ""].map((h) => (
                <th key={h} style={{ textAlign: "left", padding: "12px 16px", fontWeight: 700, color: meta.accent, fontSize: 12, textTransform: "uppercase", letterSpacing: 0.3 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr><td colSpan={5} style={{ textAlign: "center", padding: "40px 16px", color: "#8891B5" }}>No se encontraron movimientos con los filtros seleccionados.</td></tr>
            ) : filtered.map((e) => {
              const cat = catById[e.category];
              return (
                <tr key={e.id} style={{ borderTop: "1px solid #F1F2FA" }}>
                  <td style={{ padding: "12px 16px", color: "#1E2340" }}>{fmtDate(e.date)}</td>
                  <td style={{ padding: "12px 16px" }}>
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, fontWeight: 600, color: cat ? cat.color : "#8891B5", background: (cat ? cat.color : "#8891B5") + "1A", padding: "4px 10px", borderRadius: 999 }}>{cat ? cat.label : "—"}</span>
                  </td>
                  <td style={{ padding: "12px 16px", fontWeight: 700, color: "#1E2340" }}>{clp(e.amount)}</td>
                  <td style={{ padding: "12px 16px", color: "#5A6083", maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.description || "—"}</td>
                  <td style={{ padding: "12px 16px", textAlign: "right", whiteSpace: "nowrap" }}>
                    <button onClick={() => openEditModal(e)} aria-label="Editar" style={{ background: "none", border: "none", padding: 4, marginRight: 4 }}><Icon name="edit" size={16} color="#8891B5" /></button>
                    <button onClick={() => handleDelete(e.id)} aria-label="Eliminar" style={{ background: "none", border: "none", padding: 4 }}><Icon name="trash" size={16} color="#EF4444" /></button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {modalOpen && (
        <Modal title={editingId ? `Editar ${meta.singular.toLowerCase()}` : `Nuevo ${meta.singular.toLowerCase()}`} onClose={() => { setModalOpen(false); setEditingId(null); }}>
          <form onSubmit={handleSubmit}>
            <div style={{ display: "grid", gap: 14 }}>
              <div>
                <label style={{ display: "block", fontSize: 12, color: "#8891B5", marginBottom: 5 }}>Fecha</label>
                <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
              </div>
              <div>
                <label style={{ display: "block", fontSize: 12, color: "#8891B5", marginBottom: 5 }}>Categoría</label>
                <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
                  {meta.categories.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
              </div>
              <div>
                <label style={{ display: "block", fontSize: 12, color: "#8891B5", marginBottom: 5 }}>Monto</label>
                <AmountInput value={form.amount} onChange={(v) => setForm({ ...form, amount: v })} accent={meta.accent} />
              </div>
              <div>
                <label style={{ display: "block", fontSize: 12, color: "#8891B5", marginBottom: 5 }}>Descripción (opcional)</label>
                <input type="text" placeholder="Ej: Supermercado Lider" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
              </div>
              {formError && <p style={{ fontSize: 12, color: "#EF4444", margin: 0 }}>{formError}</p>}
              <button type="submit" style={{ background: meta.accent, color: "#fff", border: "none", borderRadius: 10, padding: "11px 16px", fontSize: 13.5, fontWeight: 600, marginTop: 4 }}>
                {editingId ? "Guardar cambios" : `Guardar ${meta.singular.toLowerCase()}`}
              </button>
            </div>
          </form>
        </Modal>
      )}
    </div>
  );
}

function DashboardView({ movements }) {
  const [selectedMonth, setSelectedMonth] = useState("todos");

  const availableMonths = useMemo(() => {
    const keys = new Set(movements.map((m) => monthKey(m.date)));
    return Array.from(keys).sort().reverse();
  }, [movements]);

  const scopedMovements = useMemo(() => {
    if (selectedMonth === "todos") return movements;
    return movements.filter((m) => monthKey(m.date) === selectedMonth);
  }, [movements, selectedMonth]);

  const totalsByType = useMemo(() => {
    const acc = { gasto: 0, inversion: 0, ingreso: 0 };
    scopedMovements.forEach((m) => { acc[m.type] += m.amount; });
    return acc;
  }, [scopedMovements]);
  const balance = totalsByType.ingreso - totalsByType.gasto - totalsByType.inversion;

  const months = useMemo(() => {
    const keys = new Set(movements.map((m) => monthKey(m.date)));
    return Array.from(keys).sort();
  }, [movements]);

  const chartLabels = useMemo(() => {
    if (selectedMonth === "todos") return months.map(monthLabelShort);
    const n = daysInMonth(selectedMonth);
    return Array.from({ length: n }, (_, i) => String(i + 1));
  }, [selectedMonth, months]);

  const seriesData = useMemo(() => {
    if (selectedMonth === "todos") {
      const build = (type) => months.map((mk) => movements.filter((m) => m.type === type && monthKey(m.date) === mk).reduce((s, m) => s + m.amount, 0));
      return [
        { label: "Ingresos", color: "#10B981", data: build("ingreso") },
        { label: "Gastos", color: "#EA580C", data: build("gasto") },
        { label: "Inversiones", color: "#7C3AED", data: build("inversion") },
      ];
    }
    const n = daysInMonth(selectedMonth);
    const build = (type) => Array.from({ length: n }, (_, i) => {
      const dayIso = `${selectedMonth}-${pad2(i + 1)}`;
      return movements.filter((m) => m.type === type && m.date === dayIso).reduce((s, m) => s + m.amount, 0);
    });
    return [
      { label: "Ingresos", color: "#10B981", data: build("ingreso") },
      { label: "Gastos", color: "#EA580C", data: build("gasto") },
      { label: "Inversiones", color: "#7C3AED", data: build("inversion") },
    ];
  }, [selectedMonth, months, movements]);

  const hasChartData = selectedMonth === "todos" ? months.length > 0 : scopedMovements.length > 0;

  const donutSlices = [
    { label: "Ingresos", total: totalsByType.ingreso, color: "#10B981" },
    { label: "Gastos", total: totalsByType.gasto, color: "#EA580C" },
    { label: "Inversiones", total: totalsByType.inversion, color: "#7C3AED" },
  ].filter((s) => s.total > 0);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", flexWrap: "wrap", gap: 16, marginBottom: 20 }}>
        <div>
          <h1 style={{ margin: 0, fontSize: 26, fontWeight: 800, color: "#1E2340" }}>Dashboard General</h1>
          <p style={{ margin: "4px 0 0", fontSize: 13.5, color: "#8891B5" }}>
            {selectedMonth === "todos" ? "Comportamiento conjunto de tus gastos, ingresos e inversiones." : `Comportamiento de ${monthLabelFull(selectedMonth).toLowerCase()}.`}
          </p>
        </div>
        <div style={{ minWidth: 200 }}>
          <label style={{ display: "block", fontSize: 11, color: "#8891B5", marginBottom: 5 }}>Mes</label>
          <select value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)}>
            <option value="todos">Vista anual (todos los meses)</option>
            {availableMonths.map((m) => <option key={m} value={m}>{monthLabelFull(m)}</option>)}
          </select>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", gap: 14, marginBottom: 22 }}>
        <KpiCard icon="wallet" iconBg="#E6F7F0" iconColor="#10B981" label="Ingresos" value={clp(totalsByType.ingreso)} />
        <KpiCard icon="wallet" iconBg="#FEEEE1" iconColor="#EA580C" label="Gastos" value={clp(totalsByType.gasto)} />
        <KpiCard icon="trend" iconBg="#F3ECFE" iconColor="#7C3AED" label="Inversiones" value={clp(totalsByType.inversion)} />
        <KpiCard icon="alert" iconBg={balance >= 0 ? "#E6F7F0" : "#FDECEC"} iconColor={balance >= 0 ? "#10B981" : "#EF4444"} label="Balance" value={clp(balance)} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 16 }}>
        <div style={{ background: "#fff", border: "1px solid #ECEEF8", borderRadius: 14, padding: 22 }}>
          <h2 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 16px", color: "#1E2340" }}>
            {selectedMonth === "todos" ? "Evolución mensual" : "Evolución diaria"}
          </h2>
          {!hasChartData ? <p style={{ color: "#8891B5", fontSize: 13 }}>Aún no hay movimientos registrados.</p> : (
            <React.Fragment>
              <TrendLineChart labels={chartLabels} series={seriesData} />
              <div style={{ display: "flex", gap: 16, marginTop: 10, flexWrap: "wrap" }}>
                {seriesData.map((s) => (
                  <span key={s.label} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#5A6083" }}>
                    <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color }}></span>{s.label}
                  </span>
                ))}
              </div>
            </React.Fragment>
          )}
        </div>
        <div style={{ background: "#fff", border: "1px solid #ECEEF8", borderRadius: 14, padding: 22 }}>
          <h2 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 16px", color: "#1E2340" }}>Distribución {selectedMonth === "todos" ? "total" : "del mes"}</h2>
          {donutSlices.length === 0 ? <p style={{ color: "#8891B5", fontSize: 13 }}>Aún no hay movimientos registrados.</p> : (
            <React.Fragment>
              <DonutChart slices={donutSlices} />
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
                {donutSlices.map((s) => (
                  <div key={s.label} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12.5 }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 6, color: "#5A6083" }}>
                      <span style={{ width: 9, height: 9, borderRadius: 3, background: s.color }}></span>{s.label}
                    </span>
                    <span style={{ fontWeight: 600, color: "#1E2340" }}>{clp(s.total)}</span>
                  </div>
                ))}
              </div>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [movements, setMovements] = useState([]);
  const [dataLoaded, setDataLoaded] = useState(false);
  const [section, setSection] = useState("dashboard");
  const [accessToken, setAccessToken] = useState(null);
  const [fileId, setFileId] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authLoading, setAuthLoading] = useState(false);
  const [authError, setAuthError] = useState("");

  const startLogin = () => {
    setAuthError("");
    setAuthLoading(true);
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setAuthError("No se pudo cargar el servicio de Google. Revisa tu conexión e inténtalo de nuevo.");
      setAuthLoading(false);
      return;
    }
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (resp) => {
        if (!resp || resp.error) {
          setAuthError("No se pudo iniciar sesión. Inténtalo nuevamente.");
          setAuthLoading(false);
          return;
        }
        const token = resp.access_token;
        setAccessToken(token);
        try {
          const profRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: `Bearer ${token}` } });
          if (profRes.ok) setProfile(await profRes.json());
        } catch (e) {}
        try {
          let fid = await driveFindFile(token);
          if (!fid) fid = await driveCreateFile(token, "[]");
          setFileId(fid);
          const data = await driveReadFile(token, fid);
          setMovements(data);
          setDataLoaded(true);
        } catch (e) {
          setAuthError("Iniciaste sesión, pero hubo un problema leyendo tu Google Drive. Intenta de nuevo.");
          setAccessToken(null);
        }
        setAuthLoading(false);
      },
    });
    client.requestAccessToken();
  };

  const persist = async (next) => {
    if (!accessToken || !fileId) return;
    try { await driveWriteFile(accessToken, fileId, JSON.stringify(next)); } catch (e) {}
  };

  const handleLogout = () => {
    if (accessToken && window.google && window.google.accounts) {
      try { window.google.accounts.oauth2.revoke(accessToken, () => {}); } catch (e) {}
    }
    setAccessToken(null); setFileId(null); setProfile(null); setMovements([]); setDataLoaded(false); setSection("dashboard");
  };

  if (!accessToken) return <LoginScreen onLogin={startLogin} loading={authLoading} error={authError} />;

  if (!dataLoaded) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#F2F4FB" }}>
        <p style={{ color: "#8891B5", fontSize: 13.5 }}>Conectando con tu Google Drive…</p>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      <aside style={{ width: 250, background: "#fff", borderRight: "1px solid #ECEEF8", padding: "24px 18px", flexShrink: 0, position: "relative" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 28 }}>
          <div style={{ width: 40, height: 40, borderRadius: 11, background: "linear-gradient(135deg,#2954D4,#7C3AED)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="wallet" color="#fff" size={20} />
          </div>
          <div>
            <p style={{ margin: 0, fontSize: 13, fontWeight: 600, color: "#2954D4", lineHeight: 1.2 }}>Control de</p>
            <p style={{ margin: 0, fontSize: 15, fontWeight: 800, color: "#7C3AED", lineHeight: 1.2 }}>Gastos Personales</p>
          </div>
        </div>
        <p style={{ fontSize: 11, fontWeight: 600, color: "#A5AAC7", textTransform: "uppercase", letterSpacing: 0.5, margin: "0 0 10px 6px" }}>General</p>
        <NavItem active={section === "dashboard"} onClick={() => setSection("dashboard")} icon="grid" accent="#1E2340">Dashboard</NavItem>
        <p style={{ fontSize: 11, fontWeight: 600, color: "#A5AAC7", textTransform: "uppercase", letterSpacing: 0.5, margin: "16px 0 10px 6px" }}>Registros</p>
        <NavItem active={section === "gasto"} onClick={() => setSection("gasto")} icon={SECTION_META.gasto.icon} accent={SECTION_META.gasto.accent}>Gastos</NavItem>
        <NavItem active={section === "inversion"} onClick={() => setSection("inversion")} icon={SECTION_META.inversion.icon} accent={SECTION_META.inversion.accent}>Inversiones</NavItem>
        <NavItem active={section === "ingreso"} onClick={() => setSection("ingreso")} icon={SECTION_META.ingreso.icon} accent={SECTION_META.ingreso.accent}>Ingresos</NavItem>

        <div style={{ position: "absolute", bottom: 20, left: 18, width: 214 }}>
          {profile && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 10, background: "#F7F8FD", marginBottom: 8 }}>
              {profile.picture ? (
                <img src={profile.picture} alt="" style={{ width: 28, height: 28, borderRadius: "50%" }} referrerPolicy="no-referrer" />
              ) : (
                <div style={{ width: 28, height: 28, borderRadius: "50%", background: "#E4E7F5" }} />
              )}
              <div style={{ minWidth: 0 }}>
                <p style={{ margin: 0, fontSize: 12, fontWeight: 600, color: "#1E2340", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{profile.name || profile.email}</p>
              </div>
            </div>
          )}
          <button onClick={handleLogout} style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderRadius: 10, border: "1px solid #ECEEF8", background: "#fff", color: "#8891B5", fontWeight: 600, fontSize: 13 }}>
            <Icon name="x" size={15} color="#8891B5" /> Cerrar sesión
          </button>
        </div>
      </aside>

      <main style={{ flex: 1, padding: "28px 32px", minWidth: 0 }}>
        {section === "dashboard" && <DashboardView movements={movements} />}
        {section !== "dashboard" && <SectionView type={section} movements={movements} setMovements={setMovements} persist={persist} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
